<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Play the Stone Paper Scissors game online! Choose 1-Player or 2-Player mode and enjoy this classic fun game with a simple and interactive interface.">
    <title>Stone, Paper, Scissors Game</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="2p.html">2 Player</a></li>
            <li><a href="about.html">About</a></li>
            <li id="user"><img id="userimg" src="icons8-user-30.png" alt="user"></li>
        </ul>
    </nav>
    <div id="pop" class="center"><h1>Score</h1>
        <h2 id="Player"></h2>
        <h2 id="score"></h2>
        <div id="win"><h2 id="winer" class="winer"></h2>
        </div>
        <button id="repla">Repla</button>
    </div>

    <h1 id="h11">Player 1 -</h1>
    <button id="stone"><img src="https://static.vecteezy.com/system/resources/previews/002/111/895/non_2x/a-stone-meteorite-isolated-on-white-background-free-vector.jpg" alt="stone"><h1>Stone</h1></button>
    <button id="paper"><img src="https://static.vecteezy.com/system/resources/previews/000/554/801/non_2x/paper-icon-vector.jpg" alt="paper"><h1>Paper</h1></button>
    <button id="scissor"><img src="https://www.svgrepo.com/show/68802/scissors.svg" alt="scissor"><h1>Scissor</h1></button>

    <br>
    <button id="start">Play</button>

    <h1 id="h12">Computer -</h1>
    <button id="computer"><img id="computer img" src="https://w1.pngwing.com/pngs/278/853/png-transparent-line-art-nose-chatbot-internet-bot-artificial-intelligence-snout-head-smile-black-and-white-thumbnail.png" alt="computer"><h1>Computer</h1></button>

    <table id="score">
        <tr>
            <th id="p11">Player 1</th>
            <th>Computer</th>
        </tr>
        <tr>
            <td id="p1score">0</td>
            <td id="p2score">0</td>
        </tr>
    </table>
    <script src="script copy.js"></script>
</body>

</html>
